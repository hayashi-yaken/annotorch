[project]
name = "annotorch"
version = "0.1.0"
description = "Annotate images/text locally and export PyTorch-ready datasets"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.2",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
annotorch = "annotorch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotorch"]
artifacts = ["src/annotorch/server/static/**"]
